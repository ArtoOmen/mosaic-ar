<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Живая мозаика — QR</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  :root { --bg: #12100e; --ink: #f6f0e4; --muted: rgba(246, 240, 228, .7); --ochre: #efb43c; --line: rgba(246, 240, 228, .16); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .8fr); gap: clamp(20px, 4vw, 56px); align-items: center;
    padding: clamp(16px, 3vw, 40px); max-width: 1500px; margin: 0 auto; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
  figure img { display: block; max-width: 100%; max-height: calc(100vh - 110px); border-radius: 6px; box-shadow: 0 30px 70px rgba(0, 0, 0, .6); }
  figcaption { margin-top: 14px; color: var(--muted); font-size: 14px; font-weight: 600; text-align: center; }
  .card { background: rgba(246, 240, 228, .05); border: 1px solid var(--line); border-radius: 28px; padding: clamp(22px, 3vw, 34px); }
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ochre); margin: 0 0 10px; }
  h1 { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: clamp(28px, 3vw, 40px); line-height: 1.05; margin: 0 0 18px; }
  .qr { background: #fff; border-radius: 20px; padding: 16px; width: min(100%, 300px); aspect-ratio: 1; }
  .qr svg { display: block; width: 100%; height: 100%; }
  .url { margin: 10px 0 22px; font: 600 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); word-break: break-all; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
  li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; font-size: 16px; line-height: 1.4; }
  li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--ochre); color: #1d160c; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 18px; border-radius: 999px; font-weight: 700; font-size: 15px;
    text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: rgba(246, 240, 228, .06); cursor: pointer; font-family: inherit; }
  .btn.primary { background: var(--ochre); color: #1d160c; border-color: transparent; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } figure img { max-height: none; } }

  /* print: an A4 sign to hang next to the mural */
  @media print {
    @page { size: A4 portrait; margin: 14mm; }
    html, body { background: #fff; color: #111; }
    main { display: block; min-height: 0; padding: 0; }
    figure, .row, .screen-only { display: none !important; }
    .card { border: 0; background: none; padding: 0; text-align: center; }
    .kicker { color: #b8282a; font-size: 14pt; }
    h1 { font-size: 40pt; margin: 4mm 0 10mm; }
    .qr { width: 110mm; margin: 0 auto; padding: 0; border-radius: 0; }
    .url { color: #555; font-size: 10pt; margin: 4mm 0 10mm; }
    ol { max-width: 150mm; margin: 0 auto; text-align: left; gap: 5mm; }
    li { font-size: 16pt; grid-template-columns: 11mm 1fr; }
    li::before { width: 9mm; height: 9mm; font-size: 13pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<main>
  <figure class="screen-only">
    <img src="assets/t/birds-a/photo.jpg" alt="Мозаика с птицами" id="muralImg">
    <figcaption>Для проверки: наведите телефон на эту картинку</figcaption>
  </figure>
  <section class="card">
    <p class="kicker">Дополненная реальность</p>
    <h1>Оживите птиц на&nbsp;мозаике</h1>
    <div class="qr" id="qr"></div>
    <p class="url" id="url"></p>
    <ol>
      <li>Отсканируйте QR-код камерой телефона</li>
      <li>Нажмите «Оживить птиц» и разрешите доступ к камере</li>
      <li>Наведите телефон на мозаику — и смотрите, как птицы просыпаются. Коснитесь птицы, и она вылетит</li>
    </ol>
    <div class="row">
      <button class="btn primary" onclick="print()">Распечатать табличку</button>
      <a class="btn" href="./">Открыть сайт</a>
      <a class="btn" href="./?mode=demo">Демо без камеры</a>
    </div>
  </section>
</main>
<script src="vendor/qrcode.js"></script>
<script>
  // QR points to the site root (or ?url=… to override)
  const params = new URLSearchParams(location.search);
  const target = params.get('url') || new URL('./', location.href).href;
  const qr = qrcode(0, 'M');
  qr.addData(target);
  qr.make();
  const n = qr.getModuleCount();
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
  document.getElementById('qr').innerHTML = `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges"><path d="${d}" fill="#111"/></svg>`;
  document.getElementById('url').textContent = target.replace(/^https?:\/\//, '');
  // fall back to the cropped mosaic if the full photo is missing
  const img = document.getElementById('muralImg');
  img.onerror = () => { img.onerror = null; img.src = 'assets/t/birds-a/mural.jpg'; };
</script>
</body>
</html>
